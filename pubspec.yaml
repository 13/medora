name: medora
description: "Medora - Home Medicine Cabinet Manager"
publish_to: 'none'

version: 0.0.9+9

environment:
  sdk: ^3.11.0

dependencies:
  # Sorted alphabetically (sort_pub_dependencies lint).
  camera: ^0.12.0
  connectivity_plus: ^7.0.0
  csv: ^7.2.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_slidable: ^4.0.3
  go_router: ^17.1.0
  google_mlkit_text_recognition: ^0.15.0
  http: ^1.3.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  local_auth: ^2.3.0
  material_color_utilities: ^0.13.0
  package_info_plus: ^8.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^12.0.1
  shared_preferences: ^2.3.5
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0
  sqflite_common_ffi_web: ^1.1.1
  supabase_flutter: ^2.9.0
  timezone: ^0.11.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/medora_icon_pill.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/medora_icon.png
    - assets/icon/medora_icon_pill.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
