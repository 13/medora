name: medora
description: "Medora - Home Medicine Cabinet Manager"
publish_to: 'none'

version: 0.2.1+13

environment:
  sdk: ^3.12.0

dependencies:
  # Sorted alphabetically (sort_pub_dependencies lint).
  camera: ^0.12.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.7
  csv: ^8.0.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.2.0
  file_picker: ^13.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_slidable: ^4.0.3
  go_router: ^18.0.1
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.3.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  local_auth: ^3.0.2
  material_color_utilities: ^0.13.0
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.13.0
  share_plus: ^13.3.0
  shared_preferences: ^2.3.5
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0
  sqflite_common_ffi_web: ^1.1.1
  supabase_flutter: ^2.9.0
  timezone: ^0.11.0
  uuid: ^4.5.1

dev_dependencies:
  # Ships with the Flutter SDK (flutter_test depends on it); declared here so
  # tests may import it directly to drive timers deterministically.
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/medora_icon_pill.png"
  min_sdk_android: 28
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/medora_icon_fg.png"
  adaptive_icon_monochrome: "assets/icon/medora_icon_mono.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/icon/medora_icon_pill.png"
    background_color: "#FFFFFF"
    theme_color: "#2E7D6F"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/medora_icon.png
    - assets/icon/medora_icon_pill.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
