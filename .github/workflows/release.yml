name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The tag build publishes to the world, so it never starts before the suite
  # is green. CI's own run on `main` is not enough: a tag can point at any
  # commit, and `Release` and `CI` start in parallel — v0.4.0+19 published
  # while CI was still running. The zone and fake-transport passes stay in
  # ci.yml; this is the one pass that must hold for the artifact being signed.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: git diff --exit-code -- lib/l10n/generated || (echo "Run 'flutter gen-l10n' and commit the result" && exit 1)
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # The sync tests against a real Supabase. They never gated a release before:
  # ci.yml does not run on tags, and nothing made the tag build wait for it.
  integration:
    uses: ./.github/workflows/integration.yml

  release:
    needs: [gates, integration]
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      # Full history: the changelog step walks back to the previous tag.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check tag matches pubspec version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB="$(sed -n 's/^version: //p' pubspec.yaml)"
          test "$TAG" = "$PUB" || { echo "tag $TAG != pubspec $PUB"; exit 1; }
          echo "version=${TAG%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${TAG##*+}" >> "$GITHUB_OUTPUT"
      - name: Require release signing secrets
        run: test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version-file: .fvmrc, cache: true }
      - name: Configure release signing
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/medora-release.jks
          printf 'storeFile=../keystore/medora-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      - name: Build APKs and bundle
        run: |
          DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY --dart-define=BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) --dart-define=GIT_SHA=${GITHUB_SHA::7} --dart-define=BUILD_CHANNEL=release"
          flutter build apk --release --split-per-abi $DEFINES
          flutter build apk --release $DEFINES
          flutter build appbundle --release $DEFINES
      - name: Name assets
        env: { V: "${{ steps.ver.outputs.version }}", B: "${{ steps.ver.outputs.build }}" }
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/medora-$V-$B-$abi.apk"
          done
          cp build/app/outputs/flutter-apk/app-release.apk "dist/medora-$V-$B-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/medora-$V-$B.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Build release notes
        run: |
          # No fallback for an empty file: release_notes.sh always prints a
          # header (and its own "See the commit log" line when nothing is
          # grouped), and a non-zero exit fails this step before any of it.
          tools/release_notes.sh "$GITHUB_REF_NAME" > dist-notes.md
          cat dist-notes.md
      - name: Create GitHub release
        env: { GH_TOKEN: "${{ github.token }}", V: "${{ steps.ver.outputs.version }}", B: "${{ steps.ver.outputs.build }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Medora $V ($B)" --notes-file dist-notes.md
