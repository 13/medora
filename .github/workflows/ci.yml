name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: git diff --exit-code -- lib/l10n/generated || (echo "Run 'flutter gen-l10n' and commit the result" && exit 1)
      - run: flutter analyze --fatal-infos
      # Golden images live in test/goldens/ and are committed. When a
      # screen changes on purpose, regenerate them locally with
      #   fvm flutter test --update-goldens test/goldens/
      # and commit the PNGs; a bare `flutter test` compares against them.
      - run: flutter test

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter build web --release

  build-android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  integration:
    # Manual (workflow_dispatch) or PRs labelled "integration": runs the sync
    # convergence test against a local Supabase started with the CLI.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Export local credentials
        # `supabase status -o env` prints API_URL=..., ANON_KEY=..., etc.
        run: supabase status -o env >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Run the convergence test
        run: |
          test -n "$API_URL" || { echo "API_URL missing from 'supabase status -o env'"; exit 1; }
          test -n "$ANON_KEY" || { echo "ANON_KEY missing from 'supabase status -o env'"; exit 1; }
          flutter test test/integration \
            --dart-define=SUPABASE_URL="$API_URL" \
            --dart-define=SUPABASE_ANON_KEY="$ANON_KEY"
      - if: always()
        run: supabase stop
