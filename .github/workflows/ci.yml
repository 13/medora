name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: git diff --exit-code -- lib/l10n/generated || (echo "Run 'flutter gen-l10n' and commit the result" && exit 1)
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      # Golden images live in test/goldens/ and are committed. When a
      # screen changes on purpose, regenerate them locally with
      #   fvm flutter test --update-goldens test/goldens/
      # and commit the PNGs; a bare `flutter test` compares against them.
      - run: flutter test
      # The runner's zone is UTC, where the daylight-saving and calendar-day
      # tests (dose schedules, sick-leave day counts, expiry reminders) pass
      # trivially. Run the suite again in a zone with daylight saving, so
      # those tests can fail here too.
      - name: flutter test (TZ=Europe/Rome)
        run: flutter test
        env:
          TZ: Europe/Rome
      # The same suite once more, with every fake table reached through the
      # app's real PostgREST datasources and a fake PostgREST that keeps the
      # server rules (test/helpers/fake_postgrest.dart).
      - name: flutter test (through the real request code)
        run: flutter test --dart-define=MEDORA_FAKE_TRANSPORT=http

  supabase-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      USE_DOCKER: '0'
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: check
    steps:
      - uses: actions/checkout@v4
      - run: psql --version
      - run: tools/check_supabase_sql.sh
      # The same checks on Supabase's own Postgres image, whose `postgres`
      # role is not a superuser and whose auth schema is the real one.
      - name: SQL checks on the supabase/postgres image
        run: tools/check_supabase_sql.sh
        env:
          USE_DOCKER: '1'
          PG_IMAGE: public.ecr.aws/supabase/postgres:15.8.1.085

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: |
          flutter build web --release \
            --dart-define=BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --dart-define=GIT_SHA=${GITHUB_SHA::7} \
            --dart-define=BUILD_CHANNEL=ci

  build-android:
    runs-on: ubuntu-latest
    needs: test
    # Mapped at the job level so the release steps can gate on
    # `env.ANDROID_KEYSTORE_BASE64 != ''` — the `secrets` context is not
    # available in a step-level `if:`, the `env` context is. With no keystore
    # secrets configured the job only builds the debug APK and the release
    # steps are skipped.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Empty when the secrets are not configured: the bundle then builds
      # local-only (AppConfig treats an empty define as "no cloud"), which is
      # not a Play-ready artifact.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Configure release signing (when secrets exist)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/medora-release.jks
          printf 'storeFile=../keystore/medora-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - run: |
          flutter build apk --debug \
            --dart-define=BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --dart-define=GIT_SHA=${GITHUB_SHA::7} \
            --dart-define=BUILD_CHANNEL=ci
      # Only main and tags produce a production-signed bundle; a feature
      # branch must not upload one as an artifact. It is also the one
      # artifact here a user can install as a release - production keystore,
      # real Supabase configuration - so About must say "release". Every
      # other build in this workflow stays `ci`.
      - name: Release bundle (when secrets exist, on main or a tag)
        if: env.ANDROID_KEYSTORE_BASE64 != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --dart-define=GIT_SHA=${GITHUB_SHA::7} \
            --dart-define=BUILD_CHANNEL=release
      - name: Upload the release bundle (when secrets exist, on main or a tag)
        if: env.ANDROID_KEYSTORE_BASE64 != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: medora-release-aab
          path: build/app/outputs/bundle/release/*.aab

  integration:
    # Manual (workflow_dispatch) or PRs labelled "integration": runs the sync
    # convergence test against a local Supabase started with the CLI.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase start
      - name: Export local credentials
        # `supabase status -o env` prints API_URL="...", ANON_KEY="...".
        # The quotes are part of the output and GITHUB_ENV takes values
        # literally, so they must be stripped or every value keeps them.
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Run the convergence test
        run: |
          test -n "$API_URL" || { echo "API_URL missing from 'supabase status -o env'"; exit 1; }
          test -n "$ANON_KEY" || { echo "ANON_KEY missing from 'supabase status -o env'"; exit 1; }
          flutter test test/integration \
            --dart-define=SUPABASE_URL="$API_URL" \
            --dart-define=SUPABASE_ANON_KEY="$ANON_KEY"
      - if: always()
        run: supabase stop
